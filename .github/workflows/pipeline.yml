# .github/workflows/pipeline.yml
# CI/CD Pipeline — MLOps Renovacion de Prestamo Sinhue
name: MLOps Pipeline CI/CD

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
            - feature_*
    workflow_dispatch:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
    
env:
    IMAGE_VERSION: "1.0.0"
    APP_VERSION: "1.0.0"
    PORT_REMOTE: "8000"

    IMAGE_NAME_FASTAPI: ${{ vars.IMAGE_NAME_FASTAPI }}
    DOCKER_FASTAPI_NAME: ${{ vars.DOCKER_FASTAPI_NAME }}
    MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
    MLFLOW_EXPERIMENT: ${{ vars.MLFLOW_EXPERIMENT }}
    EVIDENTLY_TRACKING_URI: ${{ vars.EVIDENTLY_TRACKING_URI }}

    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    GCP_DEFAULT_REGION: ${{ vars.GCP_DEFAULT_REGION }}
    GCP_BUCKET: ${{ vars.GCP_BUCKET }}
    GCP_DESTINATION: ${{ vars.GCP_DESTINATION }}
    GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
    GCP_ARTIFACT_REGISTRY_URI: ${{ vars.GCP_ARTIFACT_REGISTRY_URI }}
    GCP_CONTAINER_IMAGE_URI: ${{ vars.GCP_CONTAINER_IMAGE_URI }}

    GCP_MODEL_DIR: artifacts
    GCP_MODEL_PKL_NAME: model.pkl
    GCP_MODEL_SKOPS_NAME: model.skops
    GCP_MODEL_JSON_NAME: model.json
    GCP_MODEL_BST_NAME: model.bst
    MODEL_NAME: RenovacionPrestamoCICD

permissions:
  contents: read
  id-token: write

jobs:
    build-and-test:
        name: Run MLOps Pipeline
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v7.0.1

          - name: Setup Python
            uses: actions/setup-python@v7.0.0
            with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: 'requirements/*.txt'

          - name: Paso 1 Instalar dependencias
            run: |
                pip install --no-cache-dir awscli "dvc[s3]" mlflow
                pip install --no-cache-dir --prefer-binary -r requirements/codespaces.txt
        
          - name: Paso 2 Descargar datos de S3
            run: |
              mkdir -p data/raw data/processed
              if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && dvc pull; then
                echo "Datos descargados exitosamente desde AWS S3."
              else
                echo "ADVERTENCIA: Credenciales ausentes o fallo DVC pull."
                echo "Descargando dataset publico desde DAGsHub..."
                curl -s -L -f "https://dagshub.com/SanehetSiordia/renovacion_prestamo_mlops/raw/main/data/raw/raw_renovacion_prestamo.csv" -o data/raw/raw_renovacion_prestamo.csv
                curl -s -L -f "https://dagshub.com/SanehetSiordia/renovacion_prestamo_mlops/raw/main/data/processed/processed_renovacion_prestamo.csv" -o data/processed/processed_renovacion_prestamo.csv
                echo "Archivos descargados correctamente."
              fi

              test -f data/raw/raw_renovacion_prestamo.csv || { echo "Error: raw_renovacion_prestamo.csv no existe"; exit 1; }
              test -f data/processed/processed_renovacion_prestamo.csv || { echo "Error: processed_renovacion_prestamo.csv no existe"; exit 1; }

          - name: Paso 3 Levantar MLflow Server
            run: |
                mkdir -p mlruns
                nohup mlflow server \
                    --host 0.0.0.0 \
                    --port 5000 \
                    --backend-store-uri sqlite:///mlruns/mlflow.db \
                    --default-artifact-root ./mlruns \
                    --allowed-hosts "*" > mlruns/mlflow.log 2>&1 &
                echo "Verificando Healthcheck del MLFLOW SERVER..."
                until python3 -c "import urllib.request; urllib.request.urlopen('$MLFLOW_TRACKING_URI/health', timeout=2)" 2>/dev/null; do
                    echo "Esperando a que el MLFLOW SERVER este disponible..."
                    sleep 1
                done
                echo "MLflow Server activo y respondiendo correctamente."


          - name: Paso 4 Levantando Servidor de Monitoreo con Evidently
            run: |
                mkdir -p evidently_workspace
                nohup evidently ui \
                    --workspace ./evidently_workspace \
                    --host 0.0.0.0 \
                    --port 8000 > evidently_workspace/evidently.log 2>&1 &
                echo "Verificando Healthcheck del EVIDENTLY SERVER..."
                until python3 -c "import urllib.request; urllib.request.urlopen('$EVIDENTLY_TRACKING_URI/', timeout=2)" 2>/dev/null; do
                    echo "Esperando a que el EVIDENTLY SERVER este disponible..."
                    sleep 1
                done
                echo "Evidently Server activo y respondiendo correctamente."

          - name: Paso 5 Ejecutando Training de Modelos
            env:
                MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
                MLFLOW_EXPERIMENT: ${{ vars.MLFLOW_EXPERIMENT }}
            run: |
                python src/manage_data.py
                python src/train_model.py

          - name: Paso 6 Ejecutando pruebas unitarias
            run: |
                pytest tests/test_data.py -v -s
                pytest tests/test_model.py -v -s
                pytest tests/test_pipeline.py -v -s

          - name: Paso 7 Quality Gate y Validacion de Metricas
            env:
                MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
                MLFLOW_EXPERIMENT: ${{ vars.MLFLOW_EXPERIMENT }}
            run: |
                python src/validate_model.py

          - name: Paso 8 Registro de Modelo en MLflow
            env:
                MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
                MLFLOW_EXPERIMENT: ${{ vars.MLFLOW_EXPERIMENT }}
            run: |
                python src/manage_versions.py

          - name: Paso 9 Evaluando y generando reporte de data-drift con Evidently
            env:
                EVIDENTLY_TRACKING_URI: ${{ vars.EVIDENTLY_TRACKING_URI }}
            run: |
                python src/report_drift.py

# Buildkit permite construir imágenes Docker de manera más eficiente y con soporte para múltiples etapas.
# Imagen Docker multi-stage para el servidor FastAPI (target=fastapi_server).
          - name: Paso 11 Construir imagen Docker de FastAPI
            shell: bash
            env:
                DOCKER_BUILDKIT: "1"
            run: |
                LOCAL_IMAGE="$IMAGE_NAME_FASTAPI:$IMAGE_VERSION"
                docker build \
                  --target fastapi_server \
                  --build-arg APP_VERSION="$APP_VERSION" \
                  --build-arg PORT_REMOTE="$PORT_REMOTE" \
                  --tag "$LOCAL_IMAGE" \
                  .
                docker image inspect "$LOCAL_IMAGE" > /dev/null
                echo "Imagen FastAPI construida correctamente: $LOCAL_IMAGE"

          - name: Paso 12 Validar y Autentificar con Google Cloud
            id: gcp-auth
            if: github.event_name != 'pull_request'
            uses: google-github-actions/auth@v3
            with:
                project_id: ${{ vars.GCP_PROJECT_ID }}
                workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
                create_credentials_file: true

          - name: Configurar Google Cloud CLI
            if: github.event_name != 'pull_request'
            uses: google-github-actions/setup-gcloud@v3

          - name: Validar autenticacion en Google Cloud
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                if gcloud auth print-access-token > /dev/null; then
                  echo "Autenticacion con Google Cloud validada exitosamente mediante Workload Identity Federation. Proyecto: renovacion-prestamo."
                else
                  echo "::error::No fue posible obtener un token de acceso de Google Cloud."
                  exit 1
                fi

          - name: Validar acceso a recursos de Google Cloud
            shell: bash
            run: |
                echo "Validando acceso al bucket de modelos..."
                gcloud storage ls \
                  $GCP_DESTINATION/

                echo "Validando acceso a Artifact Registry..."
                gcloud artifacts repositories describe \
                  $GCP_ARTIFACT_REGISTRY \
                  --project=$GCP_PROJECT_ID \
                  --location=$GCP_DEFAULT_REGION \
                  --format="value(name)"

                echo "Validando acceso a Vertex AI Model Registry..."
                gcloud ai models list \
                  --project=$GCP_PROJECT_ID \
                  --region=$GCP_DEFAULT_REGION \
                  --limit=1 \
                  --format="value(name)"

                echo "Autenticacion y permisos de lectura en Google Cloud validados exitosamente."

# --quiet: Evita que gcloud solicite confirmaciones interactivas durante la ejecucion de comandos.
          - name: Autenticar Docker con Artifact Registry
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                gcloud auth configure-docker \
                  "$GCP_DEFAULT_REGION-docker.pkg.dev" \
                  --quiet
                echo "Docker autenticado correctamente con Artifact Registry."

#GITHUB_SHA: El hash completo del commit actual en GitHub Actions.
          - name: Validar artefactos para publicacion
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                for model_file in \
                  "$GCP_MODEL_DIR/$GCP_MODEL_PKL_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_SKOPS_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_JSON_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_BST_NAME"
                do
                  if [ ! -s "$model_file" ]; then
                    echo "::error::El artefacto no existe o esta vacio: $model_file"
                    exit 1
                  fi
                done

                SHORT_SHA="${GITHUB_SHA::12}"

                echo ">> = Anexion de variables SHORT_SHA, GCP_RELEASE_DESTINATION y GCP_VERTEX_DESTINATION al entorno de GitHub Actions."
                echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
                echo "GCP_RELEASE_DESTINATION=$GCP_DESTINATION/releases/$GITHUB_SHA" >> "$GITHUB_ENV"
                echo "GCP_VERTEX_DESTINATION=$GCP_DESTINATION/vertex/$GITHUB_SHA" >> "$GITHUB_ENV"

                echo "Artefactos del modelo validados correctamente."

          - name: Paso 14 Publicar artefactos del modelo en Cloud Storage
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                set -Eeuo pipefail

                echo "Publicando artefactos completos en:"
                echo "$GCP_RELEASE_DESTINATION"

                gcloud storage cp \
                  "$GCP_MODEL_DIR/$GCP_MODEL_PKL_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_SKOPS_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_JSON_NAME" \
                  "$GCP_MODEL_DIR/$GCP_MODEL_BST_NAME" \
                  "$GCP_RELEASE_DESTINATION/"

                echo "Publicando artefacto compatible con Vertex AI en:"
                echo "$GCP_VERTEX_DESTINATION"

                gcloud storage cp \
                  "$GCP_MODEL_DIR/$GCP_MODEL_BST_NAME" \
                  "$GCP_VERTEX_DESTINATION/$GCP_MODEL_BST_NAME"

                echo "Validando archivos publicados..."
                gcloud storage ls "$GCP_RELEASE_DESTINATION/"
                gcloud storage ls "$GCP_VERTEX_DESTINATION/"

                echo "Artefactos publicados correctamente en Cloud Storage."

# set Eeuo pipefail: errexit, nounset, errtrace, pipefail Bash en modo estricto para asegurar que errores silenciosos no pasen desapercibidos.
#Despligue de modelo en Vertex AI Model Registry. Si el modelo ya existe, se crea una nueva versión; si no, se crea un nuevo modelo.
          - name: Paso 14 Registrar modelos en Vertex AI Model Registry
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                set -Eeuo pipefail

                echo "Buscando un modelo existente con nombre: $MODEL_NAME"

                PARENT_ID="$(
                  gcloud ai models list \
                    --project="$GCP_PROJECT_ID" \
                    --region="$GCP_DEFAULT_REGION" \
                    --filter="displayName=$MODEL_NAME" \
                    --sort-by="~createTime" \
                    --limit=1 \
                    --format="value(name)"
                )"

                COMMON_ARGUMENTS=(
                  "--project=$GCP_PROJECT_ID"
                  "--region=$GCP_DEFAULT_REGION"
                  "--display-name=$MODEL_NAME"
                  "--container-image-uri=$GCP_CONTAINER_IMAGE_URI"
                  "--artifact-uri=$GCP_VERTEX_DESTINATION/"
                  "--description=Modelo para prediccion de renovacion de prestamos."
                  "--labels=environment=dev,git_sha=$SHORT_SHA"
                  "--version-description=Commit GitHub $GITHUB_SHA"
                  "--quiet"
                )

                if [ -n "$PARENT_ID" ]; then
                  if [[ "$PARENT_ID" == projects/* ]]; then
                    PARENT_MODEL="$PARENT_ID"
                  else
                    PARENT_MODEL="projects/$GCP_PROJECT_ID/locations/$GCP_DEFAULT_REGION/models/$PARENT_ID"
                  fi

                  echo "Registrando una nueva version en: $PARENT_MODEL"

                  gcloud ai models upload \
                    "${COMMON_ARGUMENTS[@]}" \
                    "--parent-model=$PARENT_MODEL"
                else
                  echo "No existe un modelo padre. Creando un nuevo modelo."

                  gcloud ai models upload \
                    "${COMMON_ARGUMENTS[@]}"
                fi

                echo "Modelo registrado correctamente en Vertex AI Model Registry."

          - name: Paso 15 Etiquetar y publicar imagen FastAPI
            if: github.event_name != 'pull_request'
            shell: bash
            run: |
                set -Eeuo pipefail

                LOCAL_IMAGE="$IMAGE_NAME_FASTAPI:$IMAGE_VERSION"
                REMOTE_VERSION="$GCP_ARTIFACT_REGISTRY_URI/$IMAGE_NAME_FASTAPI:$IMAGE_VERSION"
                REMOTE_COMMIT="$GCP_ARTIFACT_REGISTRY_URI/$IMAGE_NAME_FASTAPI:$SHORT_SHA"

                docker tag "$LOCAL_IMAGE" "$REMOTE_VERSION"
                docker tag "$LOCAL_IMAGE" "$REMOTE_COMMIT"

                docker push "$REMOTE_VERSION"
                docker push "$REMOTE_COMMIT"

                echo "Imagen FastAPI publicada correctamente:"
                echo "Version: $REMOTE_VERSION"
                echo "Commit: $REMOTE_COMMIT"

          - name: Informar omision de publicacion en PR
            if: github.event_name == 'pull_request'
            run: |
                echo "Autenticacion y Publicacion en Google Cloud omitida: ejecucion de pull request."
                echo "La autenticacion  y publicacion se ejecutaran despues del push-merge sobre la rama destino: ${{ github.base_ref }}."

          - name: Paso 16 Finalizando Servidores
            shell: bash
            run: |
                echo "Finalizando MLflow Server..."
                pkill -f "mlflow server" || echo "MLflow Server no estaba corriendo."
                echo "Finalizando Evidently Server..."
                pkill -f "evidently ui" || echo "Evidently Server no estaba corriendo."